<!DOCTYPE html>
<html>

<head>

<title>AR7 Device Tracker</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
overflow:hidden;
}

#map{
position:absolute;
top:0;
left:320px;
right:0;
bottom:0;
z-index:1;
}

#sidebar{
position:absolute;
top:0;
left:0;
width:320px;
height:100%;
background:#161616;
padding:15px;
overflow:auto;
box-sizing:border-box;
border-right:1px solid #333;
z-index:1000;
transition:0.3s;
}

.device{
background:#222;
padding:15px;
margin-top:12px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.4);
}

button{
background:#333;
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
width:100%;
font-size:16px;
transition:0.2s;
}

button:hover{
background:#444;
}

h2{
margin-top:0;
}

#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:2000;
background:#1b1b1b;
padding:35px;
border-radius:18px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

#title{
font-size:32px;
margin-bottom:20px;
}

#menuBtn{
display:none;
position:absolute;
top:15px;
left:15px;
z-index:2000;
background:#111;
width:50px;
height:50px;
font-size:22px;
border-radius:12px;
}

.statusOnline{
color:#00ff88;
font-weight:bold;
}

.statusOffline{
color:#ff4444;
font-weight:bold;
}

@media (max-width:768px){

#map{
left:0;
}

#sidebar{
transform:translateX(-100%);
width:280px;
}

#sidebar.show{
transform:translateX(0);
}

#menuBtn{
display:block;
}

}

</style>

</head>

<body>

<button id="menuBtn">
☰
</button>

<div id="login">

<div id="title">
AR7 Device Tracker
</div>

<button id="googleLogin">
Sign In With Google
</button>

</div>

<div id="sidebar" style="display:none;">

<h2>Your Devices</h2>

<div id="deviceList"></div>

<button id="logoutBtn">
Logout
</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyA9019b2kvsZFJTjzvdGMIWxHWC5UreHr4",

authDomain:"device-tracker-ar7.firebaseapp.com",

databaseURL:
"https://device-tracker-ar7-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"device-tracker-ar7",

storageBucket:
"device-tracker-ar7.firebasestorage.app",

messagingSenderId:"1027897374944",

appId:
"1:1027897374944:web:64826f4587e10ec99a7885"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const map = L.map('map').setView([20,78],4);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const markers = {};

document
.getElementById("menuBtn")
.onclick = ()=>{

document
.getElementById("sidebar")
.classList.toggle("show");

};

document
.getElementById("googleLogin")
.onclick = async ()=>{

try{

await signInWithPopup(auth,provider);

}catch(err){

alert(err.message);
console.log(err);

}

};

document
.getElementById("logoutBtn")
.onclick = ()=>{

signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

if(!user){

document.getElementById("login")
.style.display="block";

document.getElementById("sidebar")
.style.display="none";

return;

}

document.getElementById("login")
.style.display="none";

document.getElementById("sidebar")
.style.display="block";

const uid = user.uid;

const deviceId =
localStorage.getItem("deviceId")
||
Math.random().toString(36).substring(2);

localStorage.setItem("deviceId",deviceId);

let deviceName =
localStorage.getItem("deviceName");

if(!deviceName){

deviceName =
prompt("Enter device name");

localStorage.setItem(
"deviceName",
deviceName
);

}

async function updateLocation(){

navigator.geolocation.getCurrentPosition(

async(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

map.flyTo([lat,lng],18);

let batteryLevel = "Unknown";

if(navigator.getBattery){

const battery = await navigator.getBattery();

batteryLevel =
Math.round(battery.level*100)+"%";

}

const deviceData = {

name:deviceName,

platform:navigator.platform,

lat:lat,
lng:lng,

battery:batteryLevel,

updated:Date.now(),

online:true

};

set(
ref(
db,
'users/'+uid+'/devices/'+deviceId
),
deviceData
);

},

(error)=>{

console.log(error);

},

{
enableHighAccuracy:true
}

);

}

updateLocation();

setInterval(updateLocation,100);

onValue(
ref(db,'users/'+uid+'/devices'),
(snapshot)=>{

const data = snapshot.val();

if(!data)return;

document
.getElementById("deviceList")
.innerHTML="";

Object.keys(data).forEach((id)=>{

const d = data[id];

const online =
Date.now()-d.updated < 10000;

document
.getElementById("deviceList")
.innerHTML += `

<div class="device">

<b style="font-size:20px;">
${d.name}
</b>

<br><br>

Platform:
${d.platform}

<br><br>

Battery:
${d.battery}

<br><br>

Status:
<span class="${
online
?
'statusOnline'
:
'statusOffline'
}">
${
online
?
'🟢 Online'
:
'🔴 Offline'
}
</span>

<br><br>

Latitude:
${d.lat.toFixed(5)}

<br>

Longitude:
${d.lng.toFixed(5)}

</div>

`;

if(markers[id]){

markers[id]
.setLatLng([d.lat,d.lng]);

}else{

markers[id]=L.marker(
[d.lat,d.lng],
{
title:d.name
}
)
.addTo(map)
.bindPopup(d.name);

}

});

});

});

</script>

</body>
</html>
