<!DOCTYPE html>
<html>

<head>

<title>AR7 Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
}

#map{
height:100vh;
width:calc(100% - 300px);
margin-left:300px;
}

#sidebar{
position:fixed;
left:0;
top:0;
width:300px;
height:100vh;
background:#111;
color:white;
padding:15px;
box-sizing:border-box;
overflow:auto;
}

.device{
background:#222;
padding:10px;
margin-top:10px;
border-radius:10px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
background:#444;
color:white;
border-radius:8px;
}

</style>

</head>

<body>

<div id="sidebar">

<h2>AR7 Tracker</h2>

<button id="loginBtn">
Sign In With Google
</button>

<div id="devices"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyA9019b2kvsZFJTjzvdGMIWxHWC5UreHr4",

authDomain:"device-tracker-ar7.firebaseapp.com",

databaseURL:
"https://device-tracker-ar7-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"device-tracker-ar7",

storageBucket:
"device-tracker-ar7.firebasestorage.app",

messagingSenderId:"1027897374944",

appId:
"1:1027897374944:web:64826f4587e10ec99a7885"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const map = L.map('map').setView([20,78],4);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const markers = {};

document
.getElementById("loginBtn")
.onclick = async ()=>{

await signInWithPopup(auth,provider);

};

onAuthStateChanged(auth,(user)=>{

if(!user)return;

const uid = user.uid;

let deviceId =
localStorage.getItem("deviceId");

if(!deviceId){

deviceId =
Math.random().toString(36).substring(2);

localStorage.setItem(
"deviceId",
deviceId
);

}

navigator.geolocation.watchPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

map.setView([lat,lng],15);

set(

ref(
db,
'users/'+uid+'/devices/'+deviceId
),

{

name:navigator.platform,

lat:lat,
lng:lng,

updated:Date.now()

}

);

},

(error)=>{

alert("Allow location permission");

console.log(error);

},

{
enableHighAccuracy:true
}

);

onValue(

ref(db,'users/'+uid+'/devices'),

(snapshot)=>{

const data = snapshot.val();

document
.getElementById("devices")
.innerHTML="";

if(!data)return;

for(const id in data){

const d = data[id];

document
.getElementById("devices")
.innerHTML += `

<div class="device">

<b>${d.name}</b>

<br><br>

Lat:
${d.lat}

<br>

Lng:
${d.lng}

</div>

`;

if(markers[id]){

markers[id]
.setLatLng([d.lat,d.lng]);

}else{

markers[id] =
L.marker([d.lat,d.lng])
.addTo(map);

}

}

}

);

});

</script>

</body>

</html>
