<!DOCTYPE html>
<html>

<head>

<title>AR7 Device Tracker</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
overflow:hidden;
}

#map{
position:absolute;
top:0;
left:330px;
right:0;
bottom:0;
z-index:1;
}

#sidebar{
position:absolute;
top:0;
left:0;
width:330px;
height:100%;
background:#151515;
overflow:auto;
padding:15px;
border-right:1px solid #333;
z-index:1000;
transition:0.3s;
}

#logo{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.device{
background:#202020;
padding:15px;
margin-top:12px;
border-radius:16px;
box-shadow:0 0 15px rgba(0,0,0,0.4);
animation:fade 0.3s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

button{
background:#2d2d2d;
color:white;
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
margin-top:10px;
width:100%;
font-size:15px;
transition:0.2s;
}

button:hover{
background:#3a3a3a;
}

.online{
color:#00ff88;
font-weight:bold;
}

.offline{
color:#ff4444;
font-weight:bold;
}

#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1a1a1a;
padding:35px;
border-radius:20px;
text-align:center;
z-index:2000;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

#title{
font-size:34px;
margin-bottom:20px;
font-weight:bold;
}

#menuBtn{
display:none;
position:absolute;
top:15px;
left:15px;
z-index:2000;
background:#111;
width:55px;
height:55px;
font-size:24px;
border-radius:15px;
}

.info{
margin-top:8px;
color:#ccc;
font-size:14px;
}

@media (max-width:768px){

#map{
left:0;
}

#sidebar{
transform:translateX(-100%);
width:290px;
}

#sidebar.show{
transform:translateX(0);
}

#menuBtn{
display:block;
}

}

</style>

</head>

<body>

<button id="menuBtn">
☰
</button>

<div id="login">

<div id="title">
AR7 Tracker
</div>

<button id="googleLogin">
Sign In With Google
</button>

</div>

<div id="sidebar" style="display:none;">

<div id="logo">
AR7 Tracker
</div>

<div id="deviceList"></div>

<button id="logoutBtn">
Logout
</button>

</div>

<div id="map"></div>

<audio id="alarmSound">

<source
src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
type="audio/ogg">

</audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyA9019b2kvsZFJTjzvdGMIWxHWC5UreHr4",

authDomain:"device-tracker-ar7.firebaseapp.com",

databaseURL:
"https://device-tracker-ar7-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"device-tracker-ar7",

storageBucket:
"device-tracker-ar7.firebasestorage.app",

messagingSenderId:"1027897374944",

appId:
"1:1027897374944:web:64826f4587e10ec99a7885"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const map = L.map('map').setView([20,78],4);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const markers = {};

document
.getElementById("menuBtn")
.onclick = ()=>{

document
.getElementById("sidebar")
.classList.toggle("show");

};

document
.getElementById("googleLogin")
.onclick = async ()=>{

try{

await signInWithPopup(auth,provider);

}catch(err){

alert(err.message);

}

};

document
.getElementById("logoutBtn")
.onclick = ()=>{

signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

if(!user){

document.getElementById("login")
.style.display="block";

document.getElementById("sidebar")
.style.display="none";

return;

}

document.getElementById("login")
.style.display="none";

document.getElementById("sidebar")
.style.display="block";

const uid = user.uid;

let deviceId =
localStorage.getItem("deviceId");

if(!deviceId){

deviceId =
Math.random().toString(36).substring(2);

localStorage.setItem(
"deviceId",
deviceId
);

}

let deviceName =
localStorage.getItem("deviceName");

if(!deviceName){

deviceName =
prompt("Enter device name");

localStorage.setItem(
"deviceName",
deviceName
);

}

navigator.geolocation.watchPosition(

async(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

let batteryLevel = "Unknown";

if(navigator.getBattery){

const battery = await navigator.getBattery();

batteryLevel =
Math.round(
battery.level*100
)+"%";

}

const deviceData = {

name:deviceName,

platform:navigator.platform,

lat:lat,
lng:lng,

battery:batteryLevel,

updated:Date.now(),

alarm:false

};

await set(

ref(
db,
'users/'+uid+'/devices/'+deviceId
),

deviceData

);

if(!markers[deviceId]){

markers[deviceId] =
L.marker([lat,lng])
.addTo(map)
.bindPopup(deviceName);

map.setView([lat,lng],16);

}else{

markers[deviceId]
.setLatLng([lat,lng]);

}

},

(error)=>{

alert("Please allow location access");

console.log(error);

},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}

);

onValue(

ref(db,'users/'+uid+'/devices'),

(snapshot)=>{

const data = snapshot.val();

document
.getElementById("deviceList")
.innerHTML="";

if(!data)return;

for(const id in data){

const d = data[id];

const online =
Date.now()-d.updated < 15000;

document
.getElementById("deviceList")
.innerHTML += `

<div class="device">

<div style="
font-size:20px;
font-weight:bold;
">

📱 ${d.name}

</div>

<div class="info">

💻 ${d.platform}

</div>

<div class="info">

🔋 ${d.battery}

</div>

<div class="info">

${
online
?
'<span class="online">🟢 Online</span>'
:
'<span class="offline">🔴 Offline</span>'
}

</div>

<button onclick="playAlarm()">

🔔 Find Device

</button>

</div>

`;

if(markers[id]){

markers[id]
.setLatLng([d.lat,d.lng]);

}else{

markers[id] =
L.marker([d.lat,d.lng])
.addTo(map)
.bindPopup(d.name);

}

}

}

);

});

window.playAlarm = ()=>{

document
.getElementById("alarmSound")
.play();

alert(
"Alarm triggered on this device"
);

};

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

</script>

</body>

</html>
