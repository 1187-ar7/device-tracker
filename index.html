<!DOCTYPE html>
<html>

<head>

<title>AR7 Tracker</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
overflow:hidden;
}

#map{
position:absolute;
top:0;
left:300px;
right:0;
bottom:0;
}

#sidebar{
position:absolute;
top:0;
left:0;
width:300px;
height:100%;
background:#1b1b1b;
padding:15px;
overflow:auto;
box-sizing:border-box;
border-right:1px solid #333;
z-index:1000;
}

.device{
background:#222;
padding:10px;
margin-top:10px;
border-radius:10px;
}

button{
background:#444;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
width:100%;
font-size:16px;
}

h2{
margin-top:0;
}

#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:2000;
background:#1b1b1b;
padding:30px;
border-radius:15px;
}

</style>

</head>

<body>

<div id="login">

<h1>AR7 Device Tracker</h1>

<button id="googleLogin">
Sign In With Google
</button>

</div>

<div id="sidebar" style="display:none;">

<h2>Your Devices</h2>

<div id="deviceList"></div>

<button id="logoutBtn">
Logout
</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyA9019b2kvsZFJTjzvdGMIWxHWC5UreHr4",

authDomain:"device-tracker-ar7.firebaseapp.com",

databaseURL:
"https://device-tracker-ar7-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"device-tracker-ar7",

storageBucket:
"device-tracker-ar7.firebasestorage.app",

messagingSenderId:"1027897374944",

appId:
"1:1027897374944:web:64826f4587e10ec99a7885"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const map = L.map('map').setView([20,78],4);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const markers = {};

document
.getElementById("googleLogin")
.onclick = async ()=>{

try{

await signInWithPopup(auth,provider);

}catch(err){

alert(err.message);
console.log(err);

}

};

document
.getElementById("logoutBtn")
.onclick = ()=>{

signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

if(!user){

document.getElementById("login")
.style.display="block";

document.getElementById("sidebar")
.style.display="none";

return;

}

document.getElementById("login")
.style.display="none";

document.getElementById("sidebar")
.style.display="block";

const uid = user.uid;

const deviceId =
localStorage.getItem("deviceId")
||
Math.random().toString(36).substring(2);

localStorage.setItem("deviceId",deviceId);

navigator.geolocation.getCurrentPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

map.setView([lat,lng],15);

const marker = L.marker([lat,lng])
.addTo(map)
.bindPopup("Your Device")
.openPopup();

const deviceData = {

name:navigator.platform,

lat:lat,
lng:lng,

battery:"Unknown",

updated:Date.now()

};

set(
ref(db,
'users/'+uid+'/devices/'+deviceId),
deviceData
);

},

(error)=>{

alert("Please allow location access");
console.log(error);

},

{
enableHighAccuracy:true
}

);

onValue(
ref(db,'users/'+uid+'/devices'),
(snapshot)=>{

const data = snapshot.val();

if(!data)return;

document
.getElementById("deviceList")
.innerHTML="";

Object.keys(data).forEach((id)=>{

const d = data[id];

document
.getElementById("deviceList")
.innerHTML += `

<div class="device">

<b>${d.name}</b>

<br><br>

Latitude:
${d.lat.toFixed(5)}

<br>

Longitude:
${d.lng.toFixed(5)}

</div>

`;

if(markers[id]){

markers[id]
.setLatLng([d.lat,d.lng]);

}else{

markers[id]=L.marker([
d.lat,
d.lng
])
.addTo(map)
.bindPopup(d.name);

}

});

});

});

</script>

</body>
</html>
