<!DOCTYPE html>
<html>

<head>
  <title>AR7 Device Tracker</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyA9019b2kvsZFJTjzvdGMIWxHWC5UreHr4",

  authDomain: "device-tracker-ar7.firebaseapp.com",

  databaseURL:
  "https://device-tracker-ar7-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "device-tracker-ar7",

  storageBucket:
  "device-tracker-ar7.firebasestorage.app",

  messagingSenderId: "1027897374944",

  appId:
  "1:1027897374944:web:64826f4587e10ec99a7885"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const map = L.map('map').setView([20, 78], 4);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '© OpenStreetMap'
  }
).addTo(map);

const markers = {};

const deviceId =
  localStorage.getItem("deviceId")
  ||
  Math.random().toString(36).substring(2);

localStorage.setItem("deviceId", deviceId);

navigator.geolocation.watchPosition(

(position) => {

  const lat = position.coords.latitude;
  const lng = position.coords.longitude;

  set(ref(db, 'devices/' + deviceId), {

    lat: lat,
    lng: lng,
    updated: Date.now()

  });

},

(error) => {

  alert("Location permission denied");

},

{
  enableHighAccuracy: true
}

);

onValue(ref(db, 'devices'), (snapshot) => {

  const data = snapshot.val();

  if (!data) return;

  Object.keys(data).forEach((id) => {

    const device = data[id];

    if (markers[id]) {

      markers[id].setLatLng([
        device.lat,
        device.lng
      ]);

    } else {

      markers[id] = L.marker([
        device.lat,
        device.lng
      ])
      .addTo(map)
      .bindPopup("Device: " + id);

    }

  });

});

</script>

</body>
</html>
