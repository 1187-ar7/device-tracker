<!DOCTYPE html>
<html>

<head>

<title>AR7 Device Tracker</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
overflow:hidden;
}

#map{
position:absolute;
top:0;
left:340px;
right:0;
bottom:0;
z-index:1;
}

#sidebar{
position:absolute;
top:0;
left:0;
width:340px;
height:100%;
background:#151515;
overflow:auto;
padding:15px;
border-right:1px solid #333;
z-index:1000;
transition:0.3s;
}

#logo{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.device{
background:#202020;
padding:15px;
margin-top:15px;
border-radius:18px;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

button{
background:#2d2d2d;
color:white;
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
margin-top:10px;
width:100%;
font-size:15px;
}

button:hover{
background:#3a3a3a;
}

.online{
color:#00ff88;
font-weight:bold;
}

.offline{
color:#ff4444;
font-weight:bold;
}

#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1a1a1a;
padding:35px;
border-radius:20px;
text-align:center;
z-index:2000;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

#title{
font-size:34px;
margin-bottom:20px;
font-weight:bold;
}

#menuBtn{
display:none;
position:absolute;
top:15px;
left:15px;
z-index:2000;
background:#111;
width:55px;
height:55px;
font-size:24px;
border-radius:15px;
}

.info{
margin-top:8px;
color:#d0d0d0;
font-size:14px;
line-height:1.5;
word-break:break-word;
}

#lockScreen{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:999999;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
touch-action:none;
}

#unlockBox{
background:#1a1a1a;
padding:25px;
border-radius:20px;
width:100%;
max-width:350px;
text-align:center;
}

#unlockPin{
margin-top:20px;
padding:15px;
font-size:20px;
width:100%;
border:none;
border-radius:12px;
outline:none;
text-align:center;
background:#2b2b2b;
color:white;
}

@media (max-width:768px){

#map{
left:0;
}

#sidebar{
transform:translateX(-100%);
width:300px;
}

#sidebar.show{
transform:translateX(0);
}

#menuBtn{
display:block;
}

}

</style>

</head>

<body>

<button id="menuBtn">
☰
</button>

<div id="login">

<div id="title">
AR7 Tracker
</div>

<button id="googleLogin">
Sign In With Google
</button>

</div>

<div id="sidebar" style="display:none;">

<div id="logo">
AR7 Tracker
</div>

<button id="enableSoundBtn">
🔊 Enable Sound
</button>

<div id="deviceList"></div>

<button id="logoutBtn">
Logout
</button>

</div>

<div id="map"></div>

<div id="lockScreen">

<div id="unlockBox">

<h1>
🔒 DEVICE LOCKED
</h1>

<p id="lostMessage">
This device is lost
</p>

<input
id="unlockPin"
type="password"
placeholder="Enter PIN"
autocomplete="off"
>

<button id="unlockBtn">
Unlock Device
</button>

</div>

</div>

<audio id="alarmSound" loop>

<source
src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
type="audio/ogg">

</audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue,
update,
get
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyA9019b2kvsZFJTjzvdGMIWxHWC5UreHr4",

authDomain:"device-tracker-ar7.firebaseapp.com",

databaseURL:
"https://device-tracker-ar7-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"device-tracker-ar7",

storageBucket:
"device-tracker-ar7.firebasestorage.app",

messagingSenderId:"1027897374944",

appId:
"1:1027897374944:web:64826f4587e10ec99a7885"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const map = L.map('map').setView([20,78],4);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

const markers = {};

const sound =
document.getElementById("alarmSound");

let locallyLocked = false;

document
.getElementById("menuBtn")
.onclick = ()=>{

document
.getElementById("sidebar")
.classList.toggle("show");

};

document
.getElementById("enableSoundBtn")
.onclick = async()=>{

try{

await sound.play();

sound.pause();

sound.currentTime = 0;

alert("Sound enabled");

}catch(err){

alert("Tap again");

}

};

document
.getElementById("googleLogin")
.onclick = async()=>{

await signInWithPopup(auth,provider);

};

document
.getElementById("logoutBtn")
.onclick = ()=>{

signOut(auth);

};

window.findDevice = async(id)=>{

const user = auth.currentUser;

await update(

ref(
db,
'users/'+user.uid+'/devices/'+id
),

{
alarm:true
}

);

};

window.lockDevice = async(id)=>{

const user = auth.currentUser;

await update(

ref(
db,
'users/'+user.uid+'/devices/'+id
),

{
locked:true,
alarm:true
}

);

};

window.unlockDeviceRemote = async(id)=>{

const user = auth.currentUser;

await update(

ref(
db,
'users/'+user.uid+'/devices/'+id
),

{
locked:false,
alarm:false
}

);

};

window.renameDevice = async(id,currentName)=>{

const user = auth.currentUser;

const newName =
prompt(
"Enter new name",
currentName
);

if(!newName)return;

await update(

ref(
db,
'users/'+user.uid+'/devices/'+id
),

{
name:newName
}

);

if(id===localStorage.getItem("deviceId")){

localStorage.setItem(
"deviceName",
newName
);

}

};

onAuthStateChanged(auth,async(user)=>{

if(!user){

document.getElementById("login")
.style.display="block";

document.getElementById("sidebar")
.style.display="none";

return;

}

document.getElementById("login")
.style.display="none";

document.getElementById("sidebar")
.style.display="block";

const uid = user.uid;

let deviceId =
localStorage.getItem("deviceId");

if(!deviceId){

deviceId =
Math.random().toString(36).substring(2);

localStorage.setItem(
"deviceId",
deviceId
);

}

let deviceName =
localStorage.getItem("deviceName");

if(!deviceName){

deviceName =
prompt("Enter device name");

localStorage.setItem(
"deviceName",
deviceName
);

}

let devicePin =
localStorage.getItem("devicePin");

if(!devicePin){

devicePin =
prompt("Create device PIN");

localStorage.setItem(
"devicePin",
devicePin
);

}

document
.getElementById("unlockBtn")
.onclick = async()=>{

const pin =
document
.getElementById("unlockPin")
.value;

const snap = await get(

ref(
db,
'users/'+uid+'/devices/'+deviceId
)

);

const data = snap.val();

if(pin===data.lockPin){

locallyLocked = false;

await update(

ref(
db,
'users/'+uid+'/devices/'+deviceId
),

{
locked:false,
alarm:false
}

);

document
.getElementById("lockScreen")
.style.display="none";

sound.pause();

sound.currentTime = 0;

document
.getElementById("unlockPin")
.value="";

}else{

alert("Wrong PIN");

document
.getElementById("unlockPin")
.value="";

}

};

onValue(

ref(
db,
'users/'+uid+'/devices/'+deviceId
),

async(snapshot)=>{

const data = snapshot.val();

if(!data)return;

if(data.locked===true){

locallyLocked = true;

document
.getElementById("lockScreen")
.style.display="flex";

document.body.style.overflow="hidden";

try{

await sound.play();

}catch(err){}

}

if(
data.locked===false
&&
locallyLocked===false
){

document
.getElementById("lockScreen")
.style.display="none";

sound.pause();

sound.currentTime = 0;

}

}

);

onValue(

ref(
db,
'users/'+uid+'/devices/'+deviceId+'/alarm'
),

async(snapshot)=>{

const alarm = snapshot.val();

if(alarm===true){

try{

await sound.play();

}catch(err){}

setTimeout(async()=>{

sound.pause();

sound.currentTime = 0;

await update(

ref(
db,
'users/'+uid+'/devices/'+deviceId
),

{
alarm:false
}

);

},10000);

}

}

);

function getDeviceType(){

const ua = navigator.userAgent;

if(/mobile/i.test(ua))
return "Phone";

if(/tablet/i.test(ua))
return "Tablet";

return "Laptop/Desktop";

}

navigator.geolocation.watchPosition(

async(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

let batteryLevel = "Unknown";

if(navigator.getBattery){

const battery =
await navigator.getBattery();

batteryLevel =
Math.round(
battery.level*100
)+"%";

}

const oldSnap = await get(

ref(
db,
'users/'+uid+'/devices/'+deviceId
)

);

const oldData =
oldSnap.val() || {};

const deviceData = {

...oldData,

name:deviceName,

platform:navigator.platform,

deviceType:getDeviceType(),

manufacturer:
navigator.vendor || "Unknown",

browser:
navigator.userAgent,

lat:lat,
lng:lng,

battery:batteryLevel,

updated:Date.now(),

lockPin:devicePin

};

await set(

ref(
db,
'users/'+uid+'/devices/'+deviceId
),

deviceData

);

if(markers[deviceId]){

markers[deviceId]
.setLatLng([lat,lng]);

}else{

markers[deviceId] =
L.marker([lat,lng])
.addTo(map)
.bindPopup(deviceName);

map.setView([lat,lng],16);

}

},

(error)=>{

console.log(error);

},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}

);

onValue(

ref(
db,
'users/'+uid+'/devices'
),

(snapshot)=>{

const data = snapshot.val();

document
.getElementById("deviceList")
.innerHTML="";

if(!data)return;

Object.keys(data).forEach((id)=>{

const d = data[id];

const online =
Date.now()-d.updated < 15000;

const lastSeen =
new Date(d.updated)
.toLocaleString();

document
.getElementById("deviceList")
.innerHTML += `

<div class="device">

<div style="
font-size:22px;
font-weight:bold;
">
📱 ${d.name}
</div>

<div class="info">
🖥️ ${d.deviceType}
</div>

<div class="info">
🏢 ${d.manufacturer}
</div>

<div class="info">
💻 ${d.platform}
</div>

<div class="info">
🔋 ${d.battery}
</div>

<div class="info">
📍 ${d.lat?.toFixed(5)},
${d.lng?.toFixed(5)}
</div>

<div class="info">
🕒 ${lastSeen}
</div>

<div class="info">

${
online
?
'<span class="online">🟢 Online</span>'
:
'<span class="offline">🔴 Offline</span>'
}

</div>

<button onclick="renameDevice(
'${id}',
'${d.name}'
)">
✏️ Rename Device
</button>

<button onclick="findDevice(
'${id}'
)">
🔔 Find Device
</button>

<button onclick="lockDevice(
'${id}'
)">
🔒 Lock Device
</button>

<button onclick="unlockDeviceRemote(
'${id}'
)">
🔓 Unlock Device
</button>

</div>

`;

if(markers[id]){

markers[id]
.setLatLng([d.lat,d.lng]);

}else{

markers[id] =
L.marker([d.lat,d.lng])
.addTo(map)
.bindPopup(d.name);

}

});

});

});

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

</script>

</body>

</html>
